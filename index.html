<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр видео</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>
    <!-- autoplay запускает видео, muted обходит блокировку браузеров, playsinline не дает iOS развернуть видео в свой плеер -->
    <video src="PARUS.mp4" autoplay muted playsinline controls loop></video>
</body>
</html>
